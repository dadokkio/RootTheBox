server {
    listen 80;
    server_name cyberx.servegame.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cyberx.servegame.com;

    ssl_certificate /etc/nginx/certs/cyberx.crt;
    ssl_certificate_key /etc/nginx/certs/cyberx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Istanze dinamiche dei giocatori: /instance/{uuid}/... → spawner proxy
    location ~ ^/instance/([0-9a-f][0-9a-f-]+[0-9a-f])(/.*)? {
        set $instance_id $1;
        set $instance_path $2;
        proxy_pass http://spawner:8080/proxy/$instance_id$instance_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Spawner API e pagine launch: /spawner/... → spawner:8080
    location /spawner/ {
        proxy_pass http://spawner:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Cookie;
    }

    location / {
        proxy_pass http://webapp:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
